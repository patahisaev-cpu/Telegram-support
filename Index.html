
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Lab</title>
</head>
<body>
<h1>DEMO LAB</h1>
<p>Тестовая передача вымышленных чисел</p>

<input id="testNumber" placeholder="Например, 12345">
<button onclick="sendTest()">Отправить тест</button>

<p id="result">Ожидание теста</p>

<script>

async function sendTest() {
  const value = document.getElementById("testNumber").value;
  const result = document.getElementById("result");

  if (!/^\d{5}$/.test(value)) {
    result.textContent = "Введите 5 тестовых цифр";
    return;
  }

  result.textContent = "Отправка теста...";

  try {
    const response = await fetch("/api/log-test", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ number: value })
    });

    const data = await response.json();

    result.textContent = data.success
      ? "Тест успешно принят сервером!"
      : "Ошибка отправки";
  } catch (error) {
    result.textContent = "Сервер пока недоступен";
  }
}

  }
  document.getElementById("result").textContent =
    "Тестовое значение принято: " + value;
}
</script>
</body>
</html>
